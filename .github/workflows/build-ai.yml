name: Build Weasel AI rime.dll

# 手动触发专用：只在 Actions 页面点 "Run workflow" 时构建，
# push / PR 不再自动触发。
on:
  workflow_dispatch:

jobs:
  build-rime-dll:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\librime\deps\boost_1_84_0
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      PLATFORM_TOOLSET: v143
      # NOTE: RIME_PLUGINS is deliberately NOT set here. librime's
      # plugins/CMakeLists.txt switches to an explicit plugin list as soon as
      # that env var exists, which would SKIP the auto-glob and silently drop
      # rime-weasel-ai. It is set only inside the plugin-install step, which
      # runs before CMake configures, and cmake then discovers every directory
      # under librime/plugins (lua, octagram, predict, rime-weasel-ai).
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure build environment
        shell: pwsh
        run: |
          Copy-Item env.vs2022.bat env.bat
          Copy-Item env.vs2022.bat librime\env.bat
          "BOOST_ROOT=$env:BOOST_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RIME_ROOT=$env:GITHUB_WORKSPACE\librime" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-librime

      - name: Cache librime deps build
        uses: actions/cache@v4
        with:
          path: |
            librime\deps\glog\build
            librime\deps\googletest\build
            librime\deps\leveldb\build
            librime\deps\marisa-trie\build
            librime\deps\opencc\build
            librime\deps\yaml-cpp\build
            librime\lib
            librime\share
          key: ${{ runner.os }}-rime-deps-x64-${{ hashFiles('librime/.git-modules', 'librime/deps/*/HEAD') }}
          restore-keys: |
            ${{ runner.os }}-rime-deps-x64-

      - name: Install Boost (into librime deps)
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd librime
          # install_boost.bat needs aria2c; runner doesn't have it by default.
          # Download and unpack Boost directly instead (faster and no extra tool).
          if (-not (Test-Path "$env:BOOST_ROOT\boost")) {
            $v = "1.84.0"
            $xyz = "1_84_0"
            $url = "https://archives.boost.io/release/$v/source/boost_$xyz.7z"
            New-Item -ItemType Directory -Force -Path "deps" | Out-Null
            Invoke-WebRequest -Uri $url -OutFile "deps\boost_$xyz.7z"
            7z x "deps\boost_$xyz.7z" -o"deps" -y | Out-Null
          }
          if (-not (Test-Path "$env:BOOST_ROOT\boost")) { throw "Boost not prepared at $env:BOOST_ROOT" }

      - name: Install librime plugins (lua / octagram / predict)
        shell: cmd
        run: |
          cd librime
          if not exist plugins mkdir plugins
          rem Same plugin set as librime's official release build. Must stay
          rem scoped to this step so CMake keeps auto-discovering plugins/.
          set RIME_PLUGINS=hchunhui/librime-lua lotem/librime-octagram rime/librime-predict
          call action-install-plugins-windows.bat
          if errorlevel 1 exit /b 1
          rem make sure the env var does not leak into later steps
          set RIME_PLUGINS=
          echo --- plugins dir ---
          dir /b plugins
          rem librime-lua needs Lua 5.4 sources in thirdparty/
          if not exist plugins\lua\thirdparty\lua5.4\lua.h (
            echo ERROR: lua sources missing - plugin install failed
            exit /b 1
          )

      - name: Audit plugins before configure
        shell: pwsh
        run: |
          $dirs = @('lua', 'octagram', 'predict')
          foreach ($d in $dirs) {
            $p = "librime\plugins\$d\CMakeLists.txt"
            if (-not (Test-Path $p)) { throw "cloned plugin missing: $p" }
            Write-Host "cloned plugin OK: $d"
          }
          if (Test-Path "librime\plugins\lua\thirdparty\lua5.4\lua.h") {
            Write-Host "lua sources OK"
          } else {
            throw "lua sources missing under librime\plugins\lua\thirdparty"
          }
          if ($env:RIME_PLUGINS) { throw "RIME_PLUGINS leaked into the CMake environment: $env:RIME_PLUGINS" }
          Write-Host "RIME_PLUGINS unset -> CMake will auto-glob librime/plugins"

      - name: Inject main-repo plugins into librime
        shell: cmd
        run: inject-plugins.bat

      - name: Assert all four plugin sources are in place
        shell: pwsh
        run: |
          $dirs = @('lua', 'octagram', 'predict', 'rime-weasel-ai')
          foreach ($d in $dirs) {
            $p = "librime\plugins\$d\CMakeLists.txt"
            if (-not (Test-Path $p)) { throw "plugin directory missing after injection: $p" }
            Write-Host "plugin dir OK: $d"
          }
          $m = "librime\plugins\rime-weasel-ai\src\weasel_ai_module.cc"
          if (-not (Test-Path $m)) { throw "AI plugin source missing: $m" }
          Write-Host "all four plugins ready for CMake"

      - name: Build librime (x64 only, with weasel_ai plugin)
        shell: cmd
        run: |
          cd librime
          set ARCH=x64
          call build.bat deps release
          if errorlevel 1 exit /b 1
          call build.bat release
          if errorlevel 1 exit /b 1

      - name: Verify AI + lua + octagram modules linked
        shell: pwsh
        run: |
          $dll = "librime\dist\lib\rime.dll"
          if (-not (Test-Path $dll)) { throw "rime.dll not found at $dll" }
          $bytes = [IO.File]::ReadAllBytes($dll)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $required = @{
            'weasel_ai'     = 'AI correction plugin'
            'lua_translator'= 'librime-lua (rime_ice depends on 18 lua components)'
            'octagram'      = 'librime-octagram (grammar / long sentence model)'
          }
          foreach ($k in $required.Keys) {
            if ($ascii -notmatch [regex]::Escape($k)) {
              throw ("FATAL: '{0}' not found in rime.dll - {1} was not linked" -f $k, $required[$k])
            }
            Write-Host ("OK: {0} present ({1})" -f $k, $required[$k])
          }
          $dumpbin = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if ($dumpbin) {
            $out = & $dumpbin.FullName /EXPORTS $dll | Select-String "weasel_ai"
            if ($out) { Write-Host "export check:" $out }
          }
          $size = (Get-Item $dll).Length
          Write-Host "rime.dll size: $([math]::Round($size/1MB,2)) MB"

      - name: Upload rime.dll (x64)
        uses: actions/upload-artifact@v4
        with:
          name: rime-ai-x64
          if-no-files-found: error
          path: |
            librime\dist\lib\rime.dll
            librime\dist\lib\rime.lib
            librime\dist\lib\rime.pdb
