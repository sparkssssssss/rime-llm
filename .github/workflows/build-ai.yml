name: Build Weasel AI rime.dll

# 手动触发专用：只在 Actions 页面点 "Run workflow" 时构建，
# push / PR 不再自动触发。
on:
  workflow_dispatch:

jobs:
  build-rime-dll:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\librime\deps\boost_1_84_0
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      PLATFORM_TOOLSET: v143
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure build environment
        shell: pwsh
        run: |
          Copy-Item env.vs2022.bat env.bat
          Copy-Item env.vs2022.bat librime\env.bat
          "BOOST_ROOT=$env:BOOST_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RIME_ROOT=$env:GITHUB_WORKSPACE\librime" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-librime

      - name: Install Boost (into librime deps)
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cd librime
          # install_boost.bat needs aria2c; runner doesn't have it by default.
          # Download and unpack Boost directly instead (faster and no extra tool).
          if (-not (Test-Path "$env:BOOST_ROOT\boost")) {
            $v = "1.84.0"
            $xyz = "1_84_0"
            $url = "https://archives.boost.io/release/$v/source/boost_$xyz.7z"
            New-Item -ItemType Directory -Force -Path "deps" | Out-Null
            Invoke-WebRequest -Uri $url -OutFile "deps\boost_$xyz.7z"
            7z x "deps\boost_$xyz.7z" -o"deps" -y | Out-Null
          }
          if (-not (Test-Path "$env:BOOST_ROOT\boost")) { throw "Boost not prepared at $env:BOOST_ROOT" }

      - name: Inject main-repo plugins into librime
        shell: cmd
        run: inject-plugins.bat

      - name: Assert plugin sources are in place
        shell: pwsh
        run: |
          $p = "librime\plugins\rime-weasel-ai\src\weasel_ai_module.cc"
          if (-not (Test-Path $p)) { throw "plugin source not found at $p - injection failed" }
          Write-Host "plugin source OK: $p"

      - name: Build librime (x64 only, with weasel_ai plugin)
        shell: cmd
        run: |
          cd librime
          set ARCH=x64
          call build.bat deps release
          if errorlevel 1 exit /b 1
          call build.bat release
          if errorlevel 1 exit /b 1

      - name: Verify weasel_ai module linked
        shell: pwsh
        run: |
          $dll = "librime\dist\lib\rime.dll"
          if (-not (Test-Path $dll)) { throw "rime.dll not found at $dll" }
          $bytes = [IO.File]::ReadAllBytes($dll)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          if ($ascii -notmatch 'weasel_ai') {
            throw "FATAL: rime.dll does not contain weasel_ai module - plugin injection failed"
          }
          Write-Host "OK: weasel_ai module found in rime.dll binary"
          $dumpbin = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if ($dumpbin) {
            $out = & $dumpbin.FullName /EXPORTS $dll | Select-String "weasel_ai"
            if ($out) { Write-Host "export check:" $out }
          }
          $size = (Get-Item $dll).Length
          Write-Host "rime.dll size: $([math]::Round($size/1MB,2)) MB"

      - name: Upload rime.dll (x64)
        uses: actions/upload-artifact@v4
        with:
          name: rime-ai-x64
          if-no-files-found: error
          path: |
            librime\dist\lib\rime.dll
            librime\dist\lib\rime.lib
            librime\dist\lib\rime.pdb
