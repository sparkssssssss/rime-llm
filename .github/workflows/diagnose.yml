name: Diagnose plugin injection

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-2022
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Inject plugins
        shell: cmd
        run: inject-plugins.bat

      - name: Show injection result
        shell: pwsh
        run: |
          Write-Host "=== librime\plugins 目录内容 ==="
          Get-ChildItem librime\plugins | ForEach-Object { Write-Host $_.Name }
          Write-Host "=== librime-plugins 目录内容 ==="
          Get-ChildItem librime-plugins | ForEach-Object { Write-Host $_.Name }
          Write-Host "=== inject 后插件 src 文件是否到位 ==="
          Test-Path librime\plugins\rime-weasel-ai\src\weasel_ai_module.cc
          Test-Path librime\plugins\rime-weasel-ai\CMakeLists.txt
          Write-Host "=== librime\.git 是文件还是目录 ==="
          (Get-Item librime\.git).GetType().Name
